<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>StreetFlow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="StreetFlow">
<meta name="theme-color" content="#0A0A0A">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<style>
:root{
  --orange:#FF5A00; --orange-soft:rgba(255,90,0,.14);
  --void:#0A0A0A; --ink:#161616; --ink2:#1E1E1E; --fog:#2E2E2C; --fog2:#3A3A38;
  --paper:#F5F5F5; --paper-70:rgba(245,245,245,.72); --paper-45:rgba(245,245,245,.5);
  --cobalt:#2B4EFF; --cobalt-soft:rgba(43,78,255,.18);
  --ok:#22C55E; --warn:#FBBF24; --err:#EF4444;
  --display:'Anton', 'Impact', 'Arial Narrow', sans-serif;
  --body:'Barlow', 'Helvetica Neue', Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--body);font-weight:500;font-size:15px;line-height:1.45;padding-block:0 40px;padding-inline:20px}
h1,h2,h3,h4{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
p{margin:0}
button{font-family:inherit;font-weight:600;cursor:pointer;border:0;border-radius:8px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto}

/* App-Modus: als installierte App vom Homescreen geöffnet, oder ?app=1 zum Testen im Browser. Zeigt nur den Fahrer-App-Screen, randlos, ohne Pitch-Deck-Rahmen. */
body.kiosk{padding:0;background:var(--void);overscroll-behavior-y:none}
body.kiosk .wrap{max-width:none;margin:0}
body.kiosk .top,body.kiosk .tabs,body.kiosk #steps,body.kiosk .panel,body.kiosk .kioskhide{display:none!important}
body.kiosk .main{display:block}
body.kiosk .stage{min-width:0}
body.kiosk .phone{width:100%;max-width:none;height:100vh;height:100dvh;margin:0;background:var(--void);border:0;border-radius:0;padding:0;box-shadow:none}
body.kiosk .phone .notch{display:none}
body.kiosk .screen{border-radius:0;padding-top:env(safe-area-inset-top,0px)}
body.kiosk .sb{display:none}
body.kiosk .nav{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
body.kiosk .appbar{padding-top:10px}
.kiosk-exit{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:50;width:30px;height:30px;border-radius:50%;background:rgba(20,20,20,.55);color:var(--paper-70);display:none;align-items:center;justify-content:center;font-size:15px;backdrop-filter:blur(6px)}
body.kiosk .kiosk-exit{display:flex}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 14px;border-bottom:1px solid var(--fog)}
.logo{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.logo .s{color:var(--orange)}
.logo .f{color:transparent;-webkit-text-stroke:1.5px var(--paper)}
.top .meta{font-size:13px;color:var(--paper-45);text-transform:uppercase;letter-spacing:.08em}
.top .meta b{color:var(--paper);font-weight:700}

.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:16px}
.tab{background:var(--ink);color:var(--paper-70);padding:10px 16px;border:1px solid var(--fog);font-size:14px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.tab .n{font-family:var(--display);font-size:15px;color:var(--paper-45)}
.tab.on{background:var(--orange);color:var(--void);border-color:var(--orange)}
.tab.on .n{color:var(--void)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}}
.stage{min-width:0}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.step{background:transparent;color:var(--paper-45);padding:6px 10px;border:1px solid var(--fog);border-radius:6px;font-size:12.5px;letter-spacing:.03em;text-transform:uppercase}
.step.on{color:var(--paper);border-color:var(--orange);background:var(--orange-soft)}
.step.done{color:var(--paper-70)}

.panel{background:var(--ink);border:1px solid var(--fog);border-radius:14px;padding:20px;position:sticky;top:16px}
.panel .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);font-weight:700}
.panel h2{font-size:28px;line-height:1.05;margin:6px 0 12px}
.panel p{color:var(--paper-70);font-size:14.5px}
.panel h4{font-size:13px;letter-spacing:.1em;color:var(--paper-45);margin:18px 0 8px}
.panel ul{margin:0;padding-left:18px;color:var(--paper-70);font-size:14px}
.panel li{margin-bottom:5px}
.panel .why{background:var(--cobalt-soft);border-left:3px solid var(--cobalt);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--paper);margin-top:16px}
.pnav{display:flex;gap:8px;margin-top:18px}
.pnav button{flex:1;padding:10px;background:var(--fog);color:var(--paper);font-size:14px}
.pnav button.next{background:var(--orange);color:var(--void)}
.pnav button:disabled{opacity:.35;cursor:default}

.phone{width:390px;max-width:100%;height:820px;margin:0 auto;background:#000;border:2px solid var(--fog2);border-radius:44px;padding:12px;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.phone .notch{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:122px;height:34px;background:#000;border-radius:20px;z-index:5;box-shadow:0 0 0 1px #0d0d0d}
.phone .notch:after{content:"";position:absolute;right:13px;top:11px;width:12px;height:12px;border-radius:50%;background:#12141c;box-shadow:inset 0 0 2px 1px #1f2433}
.phone{border-color:#2a2a2a;box-shadow:0 30px 80px rgba(0,0,0,.65),inset 0 0 0 2px #0e0e0e,0 0 0 1px #3a3a38}
.screen{height:100%;background:var(--void);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sb{height:48px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 26px 4px;font-size:13px;font-weight:700;color:var(--paper-70)}
.sc{flex:1;overflow-y:auto;padding:14px 18px 24px;scrollbar-width:thin;scrollbar-color:var(--fog) transparent;--dx:36px;animation:scIn .34s cubic-bezier(.2,.7,.2,1) both}
.screen[data-dir="back"] .sc{--dx:-36px}
@keyframes scIn{from{opacity:0;transform:translateX(var(--dx))}to{opacity:1;transform:none}}
.btn,.slot,.sw,.shop,.seg button,.nav button,.pk{transition:transform .12s ease,background .2s ease,border-color .2s ease}
.btn:active,.slot:active,.sw:active,.seg button:active,.pk:active{transform:scale(.965)}
.nav button:active{transform:scale(.9)}
.ring svg circle:nth-child(2){animation:ringIn 1.3s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringIn{from{stroke-dasharray:0 264}}
.bar i{animation:barIn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes barIn{from{width:0}}
.pin.on{animation:pinPop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes pinPop{0%{transform:translate(var(--px),var(--py)) scale(1)}40%{transform:translate(var(--px),calc(var(--py) - 10px)) scale(1.15)}100%{transform:translate(var(--px),var(--py)) scale(1)}}
.splash{position:absolute;inset:0;background:var(--void);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:34px;pointer-events:none}
.splash.go{animation:splashOut .7s ease 3.4s both}
.splash .logo{font-size:46px}
.splash .s{display:inline-block;opacity:0}.splash.go .s{animation:fillIn 1.1s cubic-bezier(.2,.7,.2,1) .5s both}
.splash .f{display:inline-block;opacity:0}.splash.go .f{animation:strokeIn 1.1s ease 1.4s both}
.splash small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper-45);opacity:0}.splash.go small{animation:strokeIn .9s ease 2.3s both}
@keyframes fillIn{from{clip-path:inset(0 100% 0 0);opacity:.3}to{clip-path:inset(0 0 0 0);opacity:1}}
@keyframes strokeIn{from{opacity:0;letter-spacing:.35em}to{opacity:1;letter-spacing:.02em}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.okov{position:absolute;inset:0;background:rgba(10,10,10,.94);z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:34px;pointer-events:none}
.okov.go{animation:okOut .45s ease 2.3s both}
.okov svg{width:96px;height:96px}
.okov circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:270;stroke-dashoffset:270}.okov.go circle{animation:draw .65s cubic-bezier(.2,.7,.2,1) .1s forwards}
.okov path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70}.okov.go path{animation:draw .4s ease .65s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes okOut{to{opacity:0;visibility:hidden}}
.okov b{font-family:var(--display);font-size:26px;letter-spacing:.02em;text-transform:uppercase;opacity:0}.okov.go b{animation:strokeIn .5s ease .9s both}
.okov span{font-size:13px;color:var(--paper-70);opacity:0}.okov.go span{animation:strokeIn .5s ease 1.05s both}
.ob{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -18px;padding:0 18px}
.ob::-webkit-scrollbar{display:none}
.ob>div{flex:0 0 100%;scroll-snap-align:center;background:var(--ink);border:1px solid var(--fog);border-radius:16px;padding:18px;min-height:330px;display:flex;flex-direction:column;justify-content:flex-end}
.ob .ill{flex:1;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.ob .ill svg{width:150px;height:150px}
.ob h3{font-size:26px;line-height:1;margin-bottom:8px}
.ob p{color:var(--paper-70);font-size:14px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--fog2);transition:all .2s}
.dots i.on{width:18px;background:var(--orange)}
.motifs{margin-top:10px}
.motifs button{display:flex;align-items:center;gap:6px}
.motifs i{width:10px;height:10px;border-radius:50%;display:inline-block}
@media (prefers-reduced-motion:reduce){.sc,.ring svg circle,.bar i,.pin.on,.splash,.splash *,.okov,.okov *{animation:none!important}.splash,.okov{display:none}}
.sc::-webkit-scrollbar{width:4px}.sc::-webkit-scrollbar-thumb{background:var(--fog);border-radius:2px}
.nav{display:flex;border-top:1px solid var(--fog);background:var(--ink);padding:10px 8px 18px}
.nav button{flex:1;background:transparent;color:var(--paper-45);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--orange)}

.m-h1{font-size:34px;line-height:1;margin:6px 0 10px}
.m-h2{font-size:22px;line-height:1.05;margin:16px 0 8px}
.m-sub{color:var(--paper-70);font-size:14px}
.m-lbl{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--paper-45);font-weight:700}
.btn{display:block;width:100%;padding:15px;font-size:15px;letter-spacing:.02em;margin-top:12px}
.btn.p{background:var(--orange);color:var(--void)}
.btn.g{background:var(--ink2);color:var(--paper);border:1px solid var(--fog)}
.btn:disabled{opacity:.4;cursor:default}
.field{margin-top:12px}
.field label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-45);font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;background:var(--ink);border:1px solid var(--fog);color:var(--paper);padding:12px;border-radius:8px;font-family:inherit;font-weight:600;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--ink);border:1px solid var(--fog);border-radius:12px;padding:14px;margin-top:12px}
.card.hi{border-color:var(--orange);background:linear-gradient(180deg,rgba(255,90,0,.18),rgba(255,90,0,.04))}
.kpi{font-family:var(--display);font-size:36px;line-height:1;color:var(--paper);font-variant-numeric:tabular-nums}
.kpi.o{color:var(--orange)}.kpi.c{color:var(--cobalt)}
.kpi small{font-family:var(--body);font-size:13px;color:var(--paper-45);font-weight:600;text-transform:none;margin-left:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.kpis .card{margin:0;padding:12px 10px}
.kpis .kpi{font-size:24px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.pill.ok{background:rgba(34,197,94,.15);color:var(--ok)}.pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}.pill.err{background:rgba(239,68,68,.15);color:var(--err)}.pill.c{background:var(--cobalt-soft);color:#8FA2FF}.pill.o{background:var(--orange-soft);color:var(--orange)}
.list{margin-top:8px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--fog)}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}.li .d{font-size:12.5px;color:var(--paper-45)}
.li .v{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--paper-70);margin-top:14px}
.check .bx{width:20px;height:20px;border:2px solid var(--orange);border-radius:5px;flex:none;background:var(--orange);position:relative}
.check .bx:after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid var(--void);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.bar{height:8px;background:var(--fog);border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--orange);border-radius:4px}
.map{position:relative;height:150px;border-radius:10px;overflow:hidden;background:var(--ink);border:1px solid var(--fog);margin-top:12px}
.map .mapimg,.smap .mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.map svg,.smap svg{position:absolute;inset:0;width:100%;height:100%}
.map svg{width:100%;height:100%;display:block}
.upload{border:2px dashed var(--fog2);border-radius:10px;padding:18px;text-align:center;color:var(--paper-45);font-size:13px;margin-top:12px}
.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.slot{background:var(--ink);border:1px solid var(--fog);color:var(--paper);padding:10px 6px;font-size:13px;text-align:center;border-radius:8px}
.slot.on{border-color:var(--orange);background:var(--orange-soft)}
.slot b{display:block;font-family:var(--display);font-size:17px;letter-spacing:.02em}
.ring{width:118px;height:118px;margin:6px auto 0;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-size:30px;line-height:1}
.ring .c small{font-family:var(--body);font-size:11px;color:var(--paper-45);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.note{font-size:12.5px;color:var(--paper-45);margin-top:10px}
.chart{margin-top:10px}
.chart svg{width:100%;display:block;overflow:visible}

/* car picker */
.carstage{background:radial-gradient(ellipse at 50% 90%,rgba(255,90,0,.18),transparent 60%),var(--ink);border:1px solid var(--fog);border-radius:14px;padding:6px 6px 4px;margin-top:12px;position:relative}
.carstage svg{width:100%;display:block}
.car3d{width:100%;height:226px;position:relative;cursor:grab;touch-action:none;border-radius:10px;overflow:hidden;background:radial-gradient(ellipse 70% 55% at 50% 22%,rgba(255,90,0,.26),transparent 70%),linear-gradient(180deg,#1A1A1A 0%,#0C0C0C 58%,#050505 100%)}
.car3d:active{cursor:grabbing}
.car3d canvas{display:block;width:100%!important;height:100%!important}
.car3d img{display:block;width:100%;height:100%;object-fit:contain;object-position:center 50%}
.car3d .ld{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-45);pointer-events:none}
.car3d .hint{position:absolute;right:8px;bottom:6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-45);pointer-events:none}
.carstage .wm{position:absolute;left:12px;top:10px;font-size:13px;pointer-events:none;opacity:.9}
.logo.sm{font-size:18px}.logo.sm .f{-webkit-text-stroke:1px var(--paper)}
.logo.xs{font-size:13px}.logo.xs .f{-webkit-text-stroke:.8px var(--paper)}
.appbar{display:flex;justify-content:space-between;align-items:center;padding:2px 18px 0;height:34px}
.appbar .avatar{border-width:2px}
.avatar.xs{width:28px;height:28px;font-size:11px;border-width:2px}
.sf{display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:12px;letter-spacing:.02em;width:26px;height:26px;border-radius:7px;background:var(--void);border:1.5px solid var(--orange);color:var(--orange);flex:none}
.sf .o{color:var(--orange)}.sf .w{color:transparent;-webkit-text-stroke:.7px var(--paper)}
.brandline{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--paper-45);margin-top:14px;padding-top:12px;border-top:1px solid var(--fog)}
.brandline .logo{font-size:14px}
.carstage .cap{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px;font-size:12.5px;color:var(--paper-45)}
.carstage .cap b{color:var(--paper);font-weight:700}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:22px 8px;margin-top:8px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--fog2);position:relative;padding:0;background:var(--c)}
.sw.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--void),0 0 0 4px var(--orange)}
.sw span{position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);font-size:9.5px;color:var(--paper-45);white-space:nowrap;font-weight:600}
.swatches{margin-bottom:18px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.seg button{background:var(--ink);border:1px solid var(--fog);color:var(--paper-70);padding:7px 11px;border-radius:99px;font-size:12.5px}
.seg button.on{border-color:var(--orange);color:var(--orange);background:var(--orange-soft)}

/* shop map */
.smap{position:relative;height:230px;border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--fog);margin-top:12px}
.smap svg{width:100%;height:100%;display:block}
.pin{cursor:pointer}
.shop{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--fog);cursor:pointer}
.shop:last-child{border-bottom:0}
.shop .n{width:26px;height:26px;border-radius:50%;background:var(--fog);color:var(--paper);font-family:var(--display);font-size:14px;display:flex;align-items:center;justify-content:center;flex:none}
.shop.on .n{background:var(--orange);color:var(--void)}
.shop .t{font-weight:700}.shop .d{font-size:12.5px;color:var(--paper-45)}
.shop .r{margin-left:auto;text-align:right;font-size:12.5px;white-space:nowrap}
.shop .r b{display:block;color:var(--paper);font-weight:700}
.offers{margin-top:10px}
.offer{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--fog);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--ink)}
.offer.on{border-color:var(--orange);background:var(--orange-soft)}
.offer .sw{width:34px;height:34px;border-radius:9px;flex:none}
.offer .t{font-weight:700}.offer .d{font-size:12.5px;color:var(--paper-45)}
.offer .p{margin-left:auto;text-align:right;font-family:var(--display);font-size:19px;color:var(--orange);white-space:nowrap}
.offer .p small{display:block;font-family:var(--body);font-size:10.5px;color:var(--paper-45);font-weight:400;letter-spacing:0}
.stars{color:var(--warn);letter-spacing:-1px}

/* profile */

/* ---------- 3D car (Three.js + glTF) ---------- */
const LOGO = `<span class="s">STREET</span><span class="f">FLOW</span>`;
const renderers = [];
let carGltf = null, carPromise = null, pmremEnv = null;
function loadCar(){
  if(carPromise) return carPromise;
  carPromise = new Promise((res, rej)=>{
    const loader = new THREE.GLTFLoader();
    if(window.MeshoptDecoder) loader.setMeshoptDecoder(window.MeshoptDecoder);
    const b64 = window.CAR_GLB_B64; if(!b64) return rej(new Error('no model'));
    const bin = atob(b64), buf = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
    loader.parse(buf.buffer, '', g=>{ carGltf = g; res(g); }, rej);
  });
  return carPromise;
}

function drawIcon(g, kind, x, y, r, color){
  g.save(); g.translate(x,y); g.fillStyle = color; g.strokeStyle = color; g.lineWidth = r*0.18; g.lineCap='round'; g.lineJoin='round';

 { step:'Onboarding', ui:()=>`<div class="sc">
    <div class="ob" id="ob">
      <div><div class="ill"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#2E2E2C" stroke-width="2"/><path d="M18 62 C 32 58, 40 40, 55 44 S 78 60, 86 36" fill="none" stroke="#FF5A00" stroke-width="4" stroke-linecap="round"/><circle cx="18" cy="62" r="5" fill="#FF5A00"/><circle cx="86" cy="36" r="5" fill="#F5F5F5"/></svg></div><h3>Fahr wie immer</h3><p>Drei Wochen lang zeichnet die App im Hintergrund deine Fahrten auf. Nichts wird foliert, nichts kostet dich etwas.</p></div>

      <div><div class="ill"><svg viewBox="0 0 100 100"><path d="M12 66 L22 48 Q28 38 44 37 L66 36 Q80 36 88 50 L92 60 Q94 66 90 66 Z" fill="#F5F5F5"/><rect x="32" y="48" width="30" height="14" rx="2" fill="#FF5A00"/><circle cx="30" cy="68" r="8" fill="#0A0A0A" stroke="#3A3A38" stroke-width="3"/><circle cx="76" cy="68" r="8" fill="#0A0A0A" stroke="#3A3A38" stroke-width="3"/></svg></div><h3>Folierer um die Ecke</h3><p>Du wählst einen Partnerbetrieb in deiner Nähe und buchst den Termin direkt in der App. Ab dem Tag läuft deine Pauschale.</p></div>

    <div class="dots" id="obdots"><i class="on"></i><i></i><i></i></div>
    <button class="btn p" data-go="driver:2">Auto anlegen</button>
    <button class="btn g" data-go="driver:2">Überspringen</button></div>`,
   explain:{ eyebrow:'', h:'Onboarding', p:'Drei Wischkarten erklären das Modell in je einem Satz: Fahren, fester Preis, Folierer in der Nähe. Danach kommt die Registrierung. Wer es schon kennt, überspringt.',
     must:['Maximal drei Karten, je eine Aussage','Illustration statt Screenshot','Überspringen immer möglich'], data:['Keine'],
     why:'Der Kern des Modells (Preis vor Folie) ist erklärungsbedürftig. Drei Karten kosten 10 Sekunden und senken die Abbruchquote in der Registrierung.' } },

 { step:'Auto', ui:()=>{ const c=state.car, models=CARS[c.brand]; return `<div class="sc">
    <span class="m-lbl">Schritt 1 von 3</span><h2 class="m-h1">Dein Auto</h2>
    <div class="carstage"><div class="wm logo">${LOGO}</div>${car3d(false)}<div class="cap"><span><b>${carName()}</b> · Referenzfoto</span><span>${BODIES[carBody()]}</span></div></div>
    <div class="row2">
      <div class="field"><label>Marke</label><select id="car-brand" data-car="brand">${Object.keys(CARS).map(b=>`<option ${b===c.brand?'selected':''}>${b}</option>`).join('')}</select></div>
      <div class="field"><label>Modell</label><select id="car-model" data-car="model">${models.map(m=>`<option ${m[0]===c.model?'selected':''}>${m[0]}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Farbe</label><div class="swatches">${COLORS.map(col=>`<button class="sw ${col[0]===c.color?'on':''}" style="--c:${col[1]}" data-color="${col[0]}" title="${col[0]}"><span>${col[0]}</span></button>`).join('')}</div></div>
    <p class="note">Foto zeigt ein Referenzfahrzeug (BMW 7er), unabhängig von Marke, Modell und Farbe. Deine Angaben (${carName()}, ${c.color}) gehen an den Folierer.</p>
    <div class="row2">
      <div class="field"><label>Baujahr</label><select id="car-year" data-car="year">${Array.from({length:16},(_,i)=>2026-i).map(y=>`<option ${String(y)===c.year?'selected':''}>${y}</option>`).join('')}</select></div>
      <div class="field"><label>Kennzeichen</label><input id="car-plate" value="E · SF 2026"></div>
    </div>
    <p class="note">Nicht dabei? Marke und Modell frei eintippen, wir prüfen die Folierbarkeit manuell.</p>
    <button class="btn p" data-go="driver:3">Weiter zu Freigaben</button></div>${nav('user')}`; },
   explain:{ eyebrow:'Fahrer-App · Screen 2 von 9', h:'Fahrzeugauswahl', p:'Marke, Modell und Farbe aus einem vollständigen Katalog. Der Fahrer sieht, dass die App sein Auto kennt. Das Modell bestimmt die Karosserieform (Kompakt, Kombi, SUV, Van, Transporter), die Form bestimmt später die folierbare Fläche. Das Foto hier ist im Prototyp ein festes Referenzbild, im echten Produkt zeigt es Marke, Modell und Farbe live.',
     must:['Marken- und Modellkatalog (im MVP: die 23 meistverkauften Marken in Deutschland, rund 150 Modelle, hier alle klickbar)','Farbpalette mit 18 Standardfarben, im Produkt mit Live-Vorschau','Baujahr und Kennzeichenregion (Region bestimmt spätere Einsatzstadt)','Freitext als Fallback für seltene Fahrzeuge'],
     data:['Fahrzeugstammdaten inkl. Karosserieform','Folierbare Fläche je Form (Türen, Heck, Motorhaube) für die Produktionskalkulation'], why:'Für die Produktion brauchen die Folierer später exakte Maße. Im MVP reicht der Modellname, der Partner kennt die Flächen seines Handwerks. Ein Kennzeichen-Scan mit Abfrage der Zulassungsdaten kommt nach dem Piloten.' } },

 { step:'Freigaben', ui:()=>`<div class="sc">
    <span class="m-lbl">Schritt 2 von 3</span><h2 class="m-h1">Freigaben</h2>
    <p class="m-sub">Fast fertig. Fotos vom Auto brauchen wir erst, wenn dein Angebot feststeht, nicht jetzt.</p>
    <h3 class="m-h2">Motive, die du nicht willst</h3>
    <div class="seg">${['Glücksspiel','Tabak','Alkohol','Politik','Religion','Dating','Fast Food'].map(x=>`<button class="${state.excl.has(x)?'on':''}" data-excl="${x}">${x}</button>`).join('')}</div>
    <div class="check"><span class="bx"></span><span>Ich nutze das Auto überwiegend privat und darf über die Außenflächen entscheiden.</span></div>
    <div class="check"><span class="bx"></span><span>Meine Fahrtdaten werden zur Berechnung meines Angebots verarbeitet (Vertragsgrundlage, Art. 6 Abs. 1 lit. b DSGVO). Rohdaten gehen nie an Werbekunden.</span></div>
    <div class="check"><span class="bx"></span><span>Standort „Immer erlauben" ist nötig, damit Fahrten im Hintergrund erfasst werden.</span></div>
    <p class="note">Den Lackzustand hält der Folierer bei deinem Termin in drei Fotos fest, das machst du nicht selbst und nicht jetzt.</p>
    <button class="btn p" data-go="driver:4">Tracking starten</button></div>${nav('user')}`,
   explain:{ eyebrow:'Fahrer-App · Screen 3 von 9', h:'Freigaben', p:'Bewusst ohne Fotopflicht: Jedes zusätzliche Pflichtfeld vor dem ersten Wert (hier: Tracking starten) kostet Abbrecher. Der Fahrer gibt nur, was jetzt wirklich nötig ist, Zustandsfotos macht der Folierer erst beim Termin, wenn ohnehin ein Vor-Ort-Check stattfindet.',
     must:['Branchen-Ausschluss als Vetorecht, bevor überhaupt ein Kunde da ist','Datenschutz mit Rechtsgrundlage aus dem Pitch-Konzept','Erklärung der Hintergrund-Standortfreigabe vor dem System-Dialog','Keine Fotopflicht in der Registrierung, das senkt die Hemmschwelle beim Onboarding'],
     data:['Ausschlussliste je Fahrer für das Matching','Zustandsfotos entstehen erst beim Folierer-Termin, mit Zeitstempel und Geotag'], why:'Ohne „Immer erlauben" funktioniert das Modell nicht, das muss der MVP sauber erklären. Pflichtfotos vorab wären ein zusätzlicher Abbruchpunkt ohne Gegenwert für den Fahrer, der Folierer prüft den Lack ohnehin persönlich beim Termin.' } },

 { step:'Tracking', ui:()=>`<div class="sc">
    <span class="m-lbl">Profilphase läuft</span><h2 class="m-h1">Tag 9 von 21</h2>
    <div class="ring"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#2E2E2C" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="#FF5A00" stroke-width="9" stroke-dasharray="${(9/21*264).toFixed(1)} 264" stroke-linecap="round"/></svg><div class="c">43 %<small>erfasst</small></div></div>
    <div class="kpis"><div class="card"><span class="m-lbl">km</span><div class="kpi cnt">412</div></div><div class="card"><span class="m-lbl">Fahrten</span><div class="kpi cnt">23</div></div><div class="card"><span class="m-lbl">Std.</span><div class="kpi">6,7</div></div></div>
    <div class="map">${routeSvg()}</div>
    <div class="list">
      <div class="li"><div><div class="t">Altenessen → Rüttenscheid</div><div class="d">Heute 07:52 · 14,2 km · 31 Min</div></div><span class="pill o">Rushhour</span></div>
      <div class="li"><div><div class="t">Rüttenscheid → Altenessen</div><div class="d">Gestern 17:40 · 15,1 km · 38 Min</div></div><span class="pill o">Rushhour</span></div>
      <div class="li"><div><div class="t">Altenessen → Centro Oberhausen</div><div class="d">Sa 14:05 · 9,8 km · 19 Min</div></div><span class="pill c">Einkauf</span></div>
    </div>
    <p class="note">GPS läuft im Hintergrund. Dein Angebot siehst du automatisch nach Tag 21.</p>
    <button class="btn g" data-go="driver:5">Prototyp: zum Angebot springen</button></div>${nav('route')}`,
   explain:{ eyebrow:'Fahrer-App · Screen 4 von 9', h:'Tracking-Phase', p:'Drei Wochen Wartezeit sind ein Absprungrisiko. Der Screen zeigt Fortschritt und dass die Daten ankommen, sonst deinstallieren Fahrer nach Tag 4.',
     must:['Fortschritt in Tagen und Prozent','Fahrten-Liste mit erkannten Segmenten (Rushhour, Stau, Parken)','Warnung, wenn die Standortfreigabe fehlt','Pausieren und Abbrechen ohne Hürden'],
     data:['GPS-Punkte alle 5 bis 10 Sekunden während der Fahrt','Map-Matching auf Straßensegmente (OSRM/Valhalla) serverseitig'], why:'Aus dem Algorithmus-Konzept: Rohe GPS-Punkte werden auf Segmente projiziert, bevor Kontakte gerechnet werden. Das passiert im Backend, der Fahrer sieht nur das Ergebnis.' } },

 { step:'Angebot', ui:()=>{ const sel = CAMPAIGNS[state.campaign]; return `<div class="sc">
    <span class="m-lbl">Profil abgeschlossen</span><h2 class="m-h1">Deine Angebote</h2>
    <p class="note">${CAMPAIGNS.length} Werbekunden passen zu deiner Strecke. Wähle ein Angebot, die Vergütung richtet sich nach Reichweite und Laufzeit des Kunden.</p>
    <div class="list offers">${CAMPAIGNS.map((c,i)=>`<div class="offer ${i===state.campaign?'on':''}" data-camp="${i}"><i class="sw" style="background:${c.bg};border:1px solid ${c.ac}"></i><div><div class="t">${c.name}</div><div class="d">${c.branche} · ${c.dauer} Monate Laufzeit</div></div><div class="p">${c.pay} €<small>/Monat</small></div></div>`).join('')}</div>
    <div class="card hi"><div style="display:flex;justify-content:space-between;align-items:center"><span class="m-lbl">Monatliche Pauschale · ${sel.name}</span><span class="sf">S<span class="w">F</span></span></div><div class="kpi o"><span class="cnt">${sel.pay}</span> €<small>pro Monat, fix</small></div><p class="m-sub" style="margin-top:6px">Ausgezahlt zum 1. jedes Monats, solange die Folie drauf ist.</p></div>
    <div class="carstage"><div class="wm logo">${LOGO}</div>${car3d(true)}<div class="cap"><span><b>${carName()}</b> · ${sel.name}</span><span>Teilfolierung</span></div></div>
    <p class="note">Beispielmotiv. Das echte Motiv kommt vom Werbekunden, du siehst es vor der Folierung und kannst ablehnen.</p>
    <h3 class="m-h2">Woraus sich das ergibt</h3>
    <div class="list">
      <div class="li"><div><div class="t">Erwartete Kontakte pro Monat</div><div class="d">Verkehrsstärke × Sichtbarkeit × Verweildauer</div></div><span class="v cnt" style="color:var(--cobalt)">${nf(IMP_PER_CAR)}</span></div>
      <div class="li"><div><div class="t">Fahrleistung</div><div class="d">Hochgerechnet aus 21 Tagen</div></div><span class="v">960 km</span></div>
      <div class="li"><div><div class="t">Rushhour-Anteil</div><div class="d">Ampel und Stau zählen stärker</div></div><span class="v">61 %</span></div>
      <div class="li"><div><div class="t">Innenstadt-Anteil</div><div class="d">Hohe Passantenfrequenz</div></div><span class="v">34 %</span></div>
    </div>
    <h3 class="m-h2">Bedingungen</h3>
    <div class="list">
      <div class="li"><span class="t">Folierung</span><span class="v">Teilfolierung, kostenlos für dich</span></div>
      <div class="li"><span class="t">Mindestlaufzeit</span><span class="v">${sel.dauer} Monate</span></div>
      <div class="li"><span class="t">Foto-Check</span><span class="v">1× monatlich</span></div>
      <div class="li"><span class="t">Vorzeitiger Ausstieg</span><span class="v">anteilige Rückzahlung</span></div>
    </div>
    <button class="btn p" data-go="driver:6">${sel.name}-Angebot annehmen und Folierer wählen</button>
    <button class="btn g" data-go="driver:${state.booked?7:4}">${state.booked?'Zurück zum Start':'Später entscheiden'}</button>
    <div class="brandline"><span class="logo">${LOGO}</span><span>Angebote berechnet aus deinem Fahrtenprofil · Stand 28.09.2026</span></div></div>${nav('home')}`; },
   explain:{ eyebrow:'Fahrer-App · Screen 5 von 9', h:'Angebote', p:'Der wichtigste Screen der Fahrerseite. Statt eines einzelnen Angebots sieht der Fahrer alle passenden Werbekunden nebeneinander, mit eigener Vergütung und Laufzeit, und wählt selbst aus. Das eigene Auto zeigt das Motiv des gerade ausgewählten Angebots.',
     must:['Mehrere Angebote parallel, je mit Vergütung und Laufzeit, klar auswählbar','Pauschale des gewählten Angebots groß und als fix erkennbar','Eigenes Fahrzeug mit Motiv-Vorschau des gewählten Angebots','Transparenz-Block: Kontakte, km, Rushhour, Innenstadt','Annahme löst rechtlich den Vertrag mit dem gewählten Werbekunden aus (Bestätigungscode)'],
     data:['Offene Kampagnen aus dem Backoffice, gefiltert auf Fahrprofil und Zielgebiet','Preisstufe je Kampagne aus Budget, Laufzeit und Reichweitenbedarf des Werbekunden'], why:'Reale Nachfrage schwankt: Werbekunden zahlen je nach Laufzeit und Reichweitenbedarf unterschiedlich. Mehrere Angebote nebeneinander zu zeigen ist ehrlicher als ein einzelner Fixpreis und gibt dem Fahrer die Wahl.' } },

 { step:'Folierer', ui:()=>{ const s=SHOPS[state.shop]; return `<div class="sc">
    <span class="m-lbl">Schritt 3 von 3</span><h2 class="m-h1">Folierer in der Nähe</h2>
    <div class="smap">${shopMap()}</div>
    <div class="list">${SHOPS.map((sh,i)=>`<div class="shop ${i===state.shop?'on':''}" data-shop="${i}"><div class="n">${i+1}</div><div><div class="t">${sh.n}</div><div class="d">${sh.km.toLocaleString('de-DE')} km · <span class="stars">★★★★★</span> ${sh.rating.toLocaleString('de-DE')} (${sh.cnt})</div></div><div class="r"><b>${sh.next}</b>nächster Termin</div></div>`).join('')}</div>
    <div class="card hi"><div style="display:flex;justify-content:space-between;align-items:center"><div class="t" style="font-weight:700;font-size:16px">${s.n}</div><span class="pill o">StreetFlow-Partner</span></div><div class="d" style="font-size:12.5px;color:var(--paper-70)">${s.a} · ${s.km.toLocaleString('de-DE')} km · Dauer ca. 4 Std. · Partnerbetrieb</div>
    <span class="m-lbl" style="display:block;margin-top:12px">Freie Termine</span>
    <div class="slots">${s.slots.map((sl,i)=>`<button class="slot ${state.slot===i?'on':''}" data-slot="${i}"><b>${sl[0]}</b>${sl[1]}<br>${sl[2]}</button>`).join('')}</div>
    <button class="btn p" data-go="driver:7" data-book="1">Termin buchen · ${s.slots[state.slot][0]} ${s.slots[state.slot][1]}, ${s.slots[state.slot][2]}</button></div>
    <p class="note">Die Folierung kostet dich nichts. Die Pauschale läuft ab dem Tag der Folierung. Keine Ersatzmobilität während der 4 Stunden.</p>
    <div class="brandline"><span class="logo">${LOGO}</span><span>Geprüfte Partnerbetriebe, Auftrag und Druckdaten gehen automatisch an den Folierer.</span></div></div>${nav('home')}`; },
   explain:{ eyebrow:'Fahrer-App · Screen 6 von 9', h:'Folierer & Termin', p:'Nach der Annahme wählt der Fahrer selbst einen Partnerbetrieb in der Nähe und bucht direkt einen Slot. Karte, Entfernung, Bewertung und nächster freier Termin auf einen Blick. StreetFlow foliert nicht selbst, die App vermittelt.',
     must:['Karte mit Partnerbetrieben im Umkreis, sortiert nach Entfernung','Bewertung und nächster freier Termin je Betrieb','Slot-Auswahl und Buchung in einem Schritt, Bestätigung per Push','Hinweis: kostenlos für den Fahrer, Pauschale startet am Folierungstag'],
     data:['Partnerbetriebe mit Adresse, Preis, Kapazitätskalender (im MVP vom Backoffice gepflegt)','Buchung erzeugt Auftrag beim Partner inkl. Fahrzeugdaten, Fotos und Druckdatei'], why:'Im Piloten reichen 3 bis 5 Partner in einer Stadt. Die Slots können per Backoffice eingetragen werden, eine eigene Partner-App kommt später. Die Karte ist hier stilisiert, im echten Produkt Apple/Google Maps.' } },

 { step:'Dashboard', ui:()=>{ const s=SHOPS[state.shop], sl=s.slots[state.slot]; return `<div class="sc">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div><span class="m-lbl">Hallo Paul</span><h2 class="m-h1" style="font-size:30px">${state.booked?'Monat 2 von 6':'Termin gebucht'}</h2></div>${avatar('md')}</div>
    ${state.justBooked?`<div class="okov"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="43"/><path d="M30 52 L44 66 L72 36"/></svg><b>Termin gebucht</b><span>${SHOPS[state.shop].n} · ${sl[0]} ${sl[1]}, ${sl[2]} Uhr</span></div>`:''}
    ${state.booked?'':`<div class="card" style="border-color:var(--ok)"><div class="li" style="padding:0"><div><div class="t">${s.n}</div><div class="d">${sl[0]} ${sl[1]} · ${sl[2]} Uhr · ${s.a}</div></div><span class="pill ok">Bestätigt</span></div></div>`}
    <div class="carstage"><div class="wm logo">${LOGO}</div>${car3d(true)}<div class="cap"><span><b>${carName()}</b> · ${CAMPAIGNS[state.campaign].name}</span><span>Monat 2 / ${CAMPAIGNS[state.campaign].dauer}</span></div></div>
    <button class="slot" style="width:100%;margin-top:8px;display:flex;justify-content:space-between;align-items:center;padding:11px 14px" data-go="driver:5"><span>Deine Angebote</span><span style="color:var(--paper-45);font-weight:400">${CAMPAIGNS.length} verfügbar ›</span></button>
    <div class="card hi"><div style="display:flex;justify-content:space-between;align-items:center"><span class="m-lbl">Nächste Auszahlung · ${CAMPAIGNS[state.campaign].name}</span><span class="sf">S<span class="w">F</span></span></div><div class="kpi o"><span class="cnt">${CAMPAIGNS[state.campaign].pay}</span> €<small>am 01.11.</small></div><div class="bar"><i style="width:38%"></i></div><p class="note" style="margin-top:6px">12 von 31 Tagen dieses Monats erfasst</p></div>
    ${state.photoCheckDone?`<div class="card" style="border-color:var(--ok)"><div class="li" style="padding:0"><div><div class="t">Foto-Check erledigt</div><div class="d">Front, Seite, Heck · nächster in 30 Tagen</div></div><span class="pill ok">Geprüft</span></div></div>`:`<div class="card" style="border-color:var(--warn)"><div class="li" style="padding:0"><div><div class="t">Foto-Check fällig</div><div class="d">Noch 6 Tage · Front, Seite, Heck</div></div><button class="slot" style="width:auto;padding:8px 12px;border-color:var(--warn);color:var(--warn)" data-photocheck="1">Fotos machen</button></div></div>`}
    <h3 class="m-h2">Kontakte diese Woche</h3>
    <div class="card"><div class="kpi c"><span class="cnt">8.120</span><small>Bruttokontakte</small></div><div class="chart">${bars([6100,7400,5200,8900,9300,4100,8120],'#2B4EFF',70,['Mo','Di','Mi','Do','Fr','Sa','So'])}</div></div>
    <button class="btn g" data-go="driver:8">Auszahlungen ansehen</button></div>${nav('home')}`; },
   explain:{ eyebrow:'Fahrer-App · Screen 7 von 9', h:'Aktive Kampagne', p:'Der Alltagsscreen beantwortet die drei Fragen eines Fahrers: Wann kommt Geld, was muss ich tun, wie lange noch. Das eigene Auto mit Motiv bleibt sichtbar, das schafft Identifikation. Ein direkter Link zurück zu „Deine Angebote" sorgt dafür, dass der Fahrer auch nach der Buchung jederzeit andere Kampagnen einsehen oder wechseln kann.',
     must:['Nächste Auszahlung mit Datum','Aufgaben mit Frist: monatlicher Foto-Check','Laufzeit-Fortschritt','Tracking-Status mit Warnung, wenn die App keine Fahrten mehr erfasst','Sichtbarer Rückweg zu den Angeboten, nicht nur einmalig beim Onboarding'],
     data:['Wöchentliche Kontakt-Aggregate aus der Engine','Foto-Check-Zyklus, Erinnerungen per Push'], why:'Der Foto-Check ist die günstigste Absicherung gegen abgezogene Folien und nicht bewegte Autos. Im MVP prüft ihn das Backoffice manuell. Die Angebote nur beim Onboarding zu zeigen und danach verschwinden zu lassen, würde einen Kampagnenwechsel unnötig erschweren.' } },

 { step:'Geld', ui:()=>{ const sel = CAMPAIGNS[state.campaign]; return `<div class="sc">
    <span class="m-lbl">Auszahlungen · ${sel.name}</span><h2 class="m-h1">Dein Geld</h2>
    <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="card"><span class="m-lbl">Bisher</span><div class="kpi"><span class="cnt">${sel.pay}</span> €</div></div><div class="card"><span class="m-lbl">Gesamt Vertrag</span><div class="kpi"><span class="cnt">${sel.pay*sel.dauer}</span> €</div></div></div>
    <div class="list">

      <div class="box"><div class="tag">Web · Desktop</div><h3>Kunden-Portal</h3><ul><li>Kampagne konfigurieren, Live-Kalkulation</li><li>Wirkungspakete</li><li>Fahrzeug-Matching, anonymisiert</li><li>Buchung mit Produktions-Vorkasse</li><li>Live-Reporting</li></ul></div>
    </div>
    <div class="scope">
      <div class="box"><h3>Im MVP <span class="pill ok">Muss</span></h3><ul><li>Fahrer-App komplett (alle 9 Screens)</li><li>Engine mit BASt-Daten und Map-Matching, 3 bis 4 Preisstufen</li><li>Kunden-Portal mit Kalkulation, Buchung, Reporting</li><li>Backoffice als internes Admin-Tool</li><li>Verträge, DSGVO-Konzept, Foto-Check-Prozess</li><li>Eine Stadt, 40 Autos, 3 bis 5 Partnerbetriebe</li></ul></div>
      <div class="box"><h3>Später <span class="pill c">Nach Pilot</span></h3><ul><li>Kennzeichen-Scan statt Katalogauswahl</li><li>Wirkungsmultiplikator aus eigener Attention-Studie</li><li>Partner-App für Folierer mit eigenem Kalender</li><li>Self-Service-Auszahlung</li><li>Kommerzielle Verkehrsdaten, agma-Anschluss</li><li>Mehrere Städte, Agenturzugänge, API</li></ul></div>
    </div>
    <div class="stack"><h3 style="font-size:20px;margin-bottom:6px">Tech-Vorschlag für den Piloten</h3>
    <div class="tbl"><table><tbody>
      <tr><td>Fahrer-App</td><td>React Native oder Flutter, eine Codebasis für iOS und Android. Hintergrund-Standort früh auf echten Geräten testen. Karte über Apple/Google Maps SDK.</td></tr>
      <tr><td>Fahrzeugkatalog</td><td>Eigene Tabelle Marke/Modell/Karosserieform, gepflegt im Backoffice. Kein externer Dienst nötig.</td></tr>
      <tr><td>Kunden-Portal</td><td>Web-App (React oder Next.js).</td></tr>
      <tr><td>Engine</td><td>Python-Backend, OSRM oder Valhalla, BASt SVZ plus Open-Data-Zählstellen. Tages-Batch reicht.</td></tr>
      <tr><td>Backoffice</td><td>Retool, Airtable oder ein einfaches Admin-Framework.</td></tr>

    </tbody></table></div></div></div>`,
   explain:{ eyebrow:'Übersicht', h:'Was zuerst gebaut wird', p:'Der MVP beweist eine These: Aus GPS-Daten lässt sich ein Preis ableiten, den Fahrer annehmen und Kunden bezahlen.',
     must:['Reihenfolge: Engine-Prototyp (Wochen 1 bis 6), Fahrer-App Tracking (Wochen 4 bis 12), Portal (Wochen 10 bis 18)','Erster Meilenstein: 10 Fahrer mit fertigem Profil und Angebot'],
     data:['Beispielzahlen: 38.400 Kontakte, 150 € Pauschale, 307 € Media (TKP 8,00 €), 2.000 € Produktion, 1.500 € Setup je Kampagne'], why:'Die Fahrer-App kann vor der Engine starten: Tracking sammelt schon Daten, während die Formel noch gebaut wird.' } }
];
const sides = {driver, customer, ops, arch};

/* ---------- render ---------- */
function render(){
  const side = state.side, list = sides[side], i = state.idx[side], scr = list[i];
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.side===side));
  document.getElementById('steps').innerHTML = list.length>1 ? list.map((s,j)=>`<button class="step ${j===i?'on':j<i?'done':''}" data-go="${side}:${j}">${j+1} ${s.step}</button>`).join('') : '';
  const ui = scr.ui(), toast = state.toast ? `<div class="toast">${state.toast}</div>` : '';
  const stage = document.getElementById('stage');
  if(side==='driver'){
    const dir = i < state.prevIdx ? 'back' : 'fwd'; state.prevIdx = i;
    const splash = (i===0 && state.splash) ? `<div class="splash"><div class="logo">${LOGO}</div><small>Dein Auto verdient mit</small></div>` : ''; if(i===0) state.splash = false;
    stage.innerHTML = `<div class="phone"><div class="notch"></div><div class="screen" data-dir="${dir}"><div class="sb"><span>09:41</span><span>●●● 5G ▮</span></div>${i>0?`<div class="appbar"><span class="logo sm">${LOGO}</span>${avatar('xs')}</div>`:''}${ui}${toast}${splash}</div></div>`;
    state.justBooked = false;
  }
  else if(side==='arch') stage.innerHTML = ui;
  else stage.innerHTML = `<div class="browser"><div class="bbar"><div class="dots"><i></i><i></i><i></i></div><div class="url">app.streetflow.de/${side==='ops'?'admin':'kampagnen'}</div></div><div class="bbody" style="position:relative">${ui}${toast}</div></div>`;
  const e = scr.explain; if(side==='driver') e.eyebrow = `Fahrer-App · Screen ${i+1} von ${list.length}`;
  document.getElementById('panel').innerHTML = `<div class="eyebrow">${e.eyebrow}</div><h2>${e.h}</h2><p>${e.p}</p>
    <h4>Muss können</h4><ul>${e.must.map(m=>`<li>${m}</li>`).join('')}</ul>
    <h4>Daten dahinter</h4><ul>${e.data.map(m=>`<li>${m}</li>`).join('')}</ul>
    <div class="why">${e.why}</div>
    <div class="pnav"><button data-go="${side}:${i-1}" ${i===0?'disabled':''}>Zurück</button><button class="next" data-go="${side}:${i+1}" ${i>=list.length-1?'disabled':''}>Weiter</button></div>`;
  if(state.toast){ state.toast=''; setTimeout(()=>{ const t=document.querySelector('.toast'); if(t) t.remove(); }, 2400); }
  countUp();
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('.okov,.splash').forEach(e=>e.classList.add('go'))));
  const ob = document.getElementById('ob'); if(ob){ ob.addEventListener('scroll', ()=>{ const k = Math.round(ob.scrollLeft / ob.clientWidth); document.querySelectorAll('#obdots i').forEach((d,j)=>d.classList.toggle('on', j===k)); }, {passive:true}); }
}
function countUp(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.cnt').forEach(el=>{
    const raw = el.textContent.trim(), target = parseInt(raw.replace(/\./g,''),10); if(isNaN(target)) return;
    const t0 = performance.now(), dur = 900;
    (function step(){ const k = Math.min(1,(performance.now()-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = nf(Math.round(target*e)); if(k<1) requestAnimationFrame(step); else el.textContent = raw; })();
  });
}

document.addEventListener('click', ev=>{
  const tab = ev.target.closest('.tab'); if(tab){ state.side = tab.dataset.side; render(); return; }
  const col = ev.target.closest('[data-color]'); if(col){ state.car.color = col.dataset.color;
    document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on', b.dataset.color===state.car.color));
    document.querySelectorAll('.car3d').forEach(c=>c.dataset.hex = carHex());
    const cap = document.querySelector('.carstage .cap span b'); if(cap && cap.parentElement) cap.parentElement.innerHTML = `<b>${carName()}</b> · ${state.car.color}`;
    if(window.THREE && liveCars.length) setPaint(carHex()); else render(); return; }
  const cp = ev.target.closest('[data-camp]'); if(cp){ state.campaign = +cp.dataset.camp; render(); return; }
  const ex = ev.target.closest('[data-excl]'); if(ex){ const v=ex.dataset.excl; state.excl.has(v)?state.excl.delete(v):state.excl.add(v); render(); return; }
  const tg = ev.target.closest('[data-tog]'); if(tg){ state[tg.dataset.tog] = !state[tg.dataset.tog]; render(); return; }
  const pc = ev.target.closest('[data-photo-clear]'); if(pc){ state.photo=null; try{localStorage.removeItem('sf_photo');}catch(e){} render(); return; }
  const fc = ev.target.closest('[data-photocheck]'); if(fc){ state.photoCheckDone = true; state.toast = 'Foto-Check erledigt · nächster in 30 Tagen'; render(); return; }
  const sh = ev.target.closest('[data-shop]'); if(sh){ state.shop = +sh.dataset.shop; state.slot = 0; render(); return; }
  const slot = ev.target.closest('[data-slot]'); if(slot){ state.slot = +slot.dataset.slot; render(); return; }
  const pk = ev.target.closest('[data-pk]'); if(pk){ state.calc[pk.dataset.pk] = !state.calc[pk.dataset.pk]; render(); return; }
  const row = ev.target.closest('[data-row]'); if(row){ const id=+row.dataset.row; if(state.sel.has(id)) state.sel.delete(id); else if(state.sel.size<state.calc.cars) state.sel.add(id); render(); return; }
  const go = ev.target.closest('[data-go]'); if(go && !go.disabled){
    const [s,n] = go.dataset.go.split(':'); state.side = s; state.idx[s] = Math.max(0, Math.min(sides[s].length-1, +n));
    if(go.dataset.book){ state.booked = false; state.justBooked = true; setTimeout(()=>{ state.booked = true; }, 2500); }
    if(go.dataset.toast) state.toast = go.dataset.toast;
    render(); window.scrollTo({top:0,behavior:'smooth'}); }
});
document.addEventListener('change', ev=>{
  const c = ev.target.dataset.car; if(c){ state.car[c] = ev.target.value; if(c==='brand') state.car.model = CARS[state.car.brand][0][0]; render(); return; }
  if(ev.target.dataset.photo){ const f = ev.target.files && ev.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { state.photo = r.result; try{ localStorage.setItem('sf_photo', r.result); }catch(e){} state.toast='Foto gespeichert'; render(); }; r.readAsDataURL(f); return; }
  const k = ev.target.dataset.calc; if(k){ const v=+ev.target.value; if(!v) return; state.calc[k] = k==='cars' ? Math.max(5, Math.min(40, v)) : v; if(k==='cars') state.sel = new Set(fleet.slice(0, state.calc.cars).map(f=>f[0])); render(); }
});
document.addEventListener('input', ev=>{
  const k = ev.target.dataset.calc; if(k!=='cars') return; const v=+ev.target.value; if(!v) return;
  state.calc.cars = Math.max(5, Math.min(40, v)); state.sel = new Set(fleet.slice(0, state.calc.cars).map(f=>f[0]));
  const pos = ev.target.selectionStart; render(); const el=document.getElementById('c-cars'); if(el){ el.focus(); try{el.setSelectionRange(pos,pos);}catch(e){} }
});

/* App-Modus: automatisch aktiv, wenn vom iOS-Homescreen gestartet (navigator.standalone) oder Android-PWA (display-mode:standalone), sonst manuell über ?app=1. Zeigt nur die Fahrer-App, ohne Pitch-Deck-Rahmen. */
function isStandalone(){
  try{ if(window.navigator.standalone === true) return true; }catch(e){}
  try{ if(window.matchMedia && matchMedia('(display-mode: standalone)').matches) return true; }catch(e){}
  return false;
}
if(isStandalone() || new URLSearchParams(location.search).has('app')){
  document.body.classList.add('kiosk');
  state.side = 'driver';
}
const kioskExit = document.getElementById('kioskExit');
if(kioskExit) kioskExit.addEventListener('click', () => { document.body.classList.remove('kiosk'); try{ history.replaceState(null,'',location.pathname); }catch(e){} render(); });

render();
</script>
